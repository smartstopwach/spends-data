name = "spends-data-email"
main = "worker.js"
compatibility_date = "2024-11-01"

# Hourly check — the worker only sends on the user's chosen weekday + hour.
[triggers]
crons = ["0 * * * *"]

# Create with: wrangler kv namespace create SPENDS_KV
[[kv_namespaces]]
binding = "SPENDS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set with `wrangler secret put NAME`):
#   EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, EMAILJS_PUBLIC_KEY, WORKER_TOKEN (optional)
#
# Web Push (background notifications for the installed app). Generate once, see functions/README.md:
#   VAPID_PUBLIC_KEY   base64url uncompressed P-256 point (also served by GET /push/key)
#   VAPID_PRIVATE_KEY  base64url "d" value. Keep secret.
#   VAPID_SUBJECT      contact, e.g. mailto:you@example.com
