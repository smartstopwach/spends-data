<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4338CA" />
    <meta name="color-scheme" content="light" />
    <title>Spends Data — Personal Expense Tracker</title>
    <meta
      name="description"
      content="Track money in, daily spends and your running balance. Weekly email reports, offline support, no account needed."
    />

    <!-- App / PWA -->
    <!-- Absolute path on purpose: Vite must NOT bundle the manifest into assets/.
         Bundled, its relative icon/start_url paths resolve under /assets/ (404) and
         the install prompt never appears. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Spends Data" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spends Data" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spends Data — Personal Expense Tracker" />
    <meta
      property="og:description"
      content="Track money in, daily spends and running balance. Weekly email reports, offline support."
    />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Spends Data" />
    <meta name="twitter:image" content="./icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
